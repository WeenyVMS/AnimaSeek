name: Build AnimaSeek iOS 15 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - ios15

concurrency:
  group: animaseek-ios15-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ad-hoc signed iOS 15 IPA
    runs-on: macos-26
    timeout-minutes: 60

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10.0.302
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -e
          xcode_path="/Applications/Xcode_26.6.app"
          if [[ ! -d "${xcode_path}" ]]; then
            echo "Xcode 26.6 was not found."
            find /Applications -maxdepth 1 -type d -name "Xcode*.app" -print
            exit 1
          fi
          sudo xcode-select --switch "${xcode_path}/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Display .NET environment
        shell: bash
        run: |
          set -e
          dotnet --info
          dotnet workload list

      - name: Install iOS workload
        shell: bash
        run: |
          set -e
          dotnet workload install ios

      - name: Clean previous outputs
        shell: bash
        run: |
          set -e
          rm -rf Seeker.iOS/bin Seeker.iOS/obj dist
          mkdir -p dist

      - name: Verify required project files
        shell: bash
        run: |
          set -e
          project_file="${GITHUB_WORKSPACE}/Seeker.iOS/Seeker.iOS.csproj"
          entitlements_file="${GITHUB_WORKSPACE}/Seeker.iOS/Entitlements.plist"
          info_plist="${GITHUB_WORKSPACE}/Seeker.iOS/Info.plist"
          for required_file in "${project_file}" "${entitlements_file}" "${info_plist}"; do
            if [[ ! -f "${required_file}" ]]; then
              echo "Missing required file: ${required_file}"
              exit 1
            fi
          done
          plutil -lint "${entitlements_file}"
          plutil -lint "${info_plist}"

      - name: Restore iPhone runtime
        shell: bash
        run: |
          set -e
          dotnet restore Seeker.iOS/Seeker.iOS.csproj \
            --runtime ios-arm64 \
            -p:SupportedOSPlatformVersion=15.0 \
            -p:TargetPlatformMinVersion=15.0

      - name: Build unsigned iOS 15 application
        shell: bash
        run: |
          set -o pipefail
          dotnet build Seeker.iOS/Seeker.iOS.csproj \
            --configuration Release \
            --framework net10.0-ios \
            --runtime ios-arm64 \
            --no-restore \
            -p:SupportedOSPlatformVersion=15.0 \
            -p:TargetPlatformMinVersion=15.0 \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:UseInterpreter=false \
            -p:MtouchLink=Full \
            -p:TrimMode=full \
            -p:TrimmerSingleWarn=false \
            -p:ILLinkTreatWarningsAsErrors=true \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false \
            -p:CodesignEntitlements="${GITHUB_WORKSPACE}/Seeker.iOS/Entitlements.plist" \
            2>&1 | tee ios15-build.log

      - name: Locate application bundle
        shell: bash
        run: |
          set -e
          output_directory="Seeker.iOS/bin/Release/net10.0-ios/ios-arm64"
          app_bundle="$(find "${output_directory}" -type d -name "*.app" -print -quit)"
          if [[ -z "${app_bundle}" ]]; then
            echo "No iPhone application bundle was generated."
            find "${output_directory}" -maxdepth 4 -print
            exit 1
          fi
          app_bundle="$(cd "$(dirname "${app_bundle}")" && pwd)/$(basename "${app_bundle}")"
          echo "APP_BUNDLE=${app_bundle}" >> "${GITHUB_ENV}"

      - name: Inspect application bundle
        shell: bash
        run: |
          set -e
          info_plist="${APP_BUNDLE}/Info.plist"
          plutil -lint "${info_plist}"
          bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${info_plist}")"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${info_plist}")"
          package_type="$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "${info_plist}")"
          minimum_version="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "${info_plist}")"
          executable_path="${APP_BUNDLE}/${executable_name}"
          echo "CFBundleIdentifier=${bundle_identifier}"
          echo "CFBundleExecutable=${executable_name}"
          echo "CFBundlePackageType=${package_type}"
          echo "MinimumOSVersion=${minimum_version}"
          [[ -n "${bundle_identifier}" ]] || { echo "Empty bundle identifier"; exit 1; }
          [[ "${package_type}" == "APPL" ]] || { echo "Expected APPL"; exit 1; }
          [[ "${minimum_version}" == "15.0" ]] || { echo "Expected iOS 15.0"; exit 1; }
          [[ -f "${executable_path}" ]] || { echo "Missing executable"; exit 1; }
          chmod 755 "${executable_path}"
          file "${executable_path}"
          lipo -info "${executable_path}" || true

      - name: Remove stale signatures
        shell: bash
        run: |
          set -e
          find "${APP_BUNDLE}" -type d -name "_CodeSignature" -prune -exec rm -rf {} +
          find "${APP_BUNDLE}" -type f -name "embedded.mobileprovision" -delete

      - name: Ad-hoc sign nested application contents
        shell: bash
        run: |
          set -e
          if [[ -d "${APP_BUNDLE}/Frameworks" ]]; then
            while IFS= read -r nested_code; do
              codesign --force --sign - --timestamp=none "${nested_code}"
            done < <(find "${APP_BUNDLE}/Frameworks" -depth \( -type d -name "*.framework" -o -type f -name "*.dylib" \) -print)
          fi
          if [[ -d "${APP_BUNDLE}/PlugIns" ]]; then
            while IFS= read -r app_extension; do
              codesign --force --sign - --timestamp=none --generate-entitlement-der "${app_extension}"
            done < <(find "${APP_BUNDLE}/PlugIns" -depth -type d -name "*.appex" -print)
          fi

      - name: Ad-hoc sign main application
        shell: bash
        run: |
          set -e
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements "${GITHUB_WORKSPACE}/Seeker.iOS/Entitlements.plist" \
            "${APP_BUNDLE}"

      - name: Verify application signature
        shell: bash
        run: |
          set -e
          codesign --display --verbose=4 "${APP_BUNDLE}"
          codesign --display --entitlements :- "${APP_BUNDLE}" 2>/dev/null || true
          codesign --verify --deep --strict --verbose=4 "${APP_BUNDLE}"

      - name: Package TrollStore-compatible IPA
        shell: bash
        run: |
          set -e
          staging="${RUNNER_TEMP}/animaseek-ios15"
          ipa_path="${GITHUB_WORKSPACE}/dist/AnimaSeek-iOS15-TrollStore.ipa"
          rm -rf "${staging}"
          mkdir -p "${staging}/Payload" "${GITHUB_WORKSPACE}/dist"
          cp -R "${APP_BUNDLE}" "${staging}/Payload/"
          (cd "${staging}" && zip -qry "${ipa_path}" Payload)
          [[ -f "${ipa_path}" ]] || { echo "IPA not generated"; exit 1; }
          app_count="$(unzip -Z1 "${ipa_path}" | grep -E '^Payload/[^/]+\.app/$' | wc -l | tr -d ' ')"
          [[ "${app_count}" == "1" ]] || { echo "Expected one top-level app"; exit 1; }
          ls -lh "${ipa_path}"

      - name: Upload TrollStore IPA
        uses: actions/upload-artifact@v7
        with:
          name: AnimaSeek-iOS15-TrollStore
          path: dist/AnimaSeek-iOS15-TrollStore.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AnimaSeek-iOS15-build-log
          path: ios15-build.log
          retention-days: 30
          if-no-files-found: ignore
