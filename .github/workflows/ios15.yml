name: Build AnimaSeek iOS 15 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ios15

concurrency:
  group: animaseek-ios15-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS 15 IPA
    runs-on: macos-26
    timeout-minutes: 60

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10.0.302
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -e

          xcode_path="/Applications/Xcode_26.6.app"

          if [[ ! -d "${xcode_path}" ]]; then
            echo "Xcode 26.6 was not found."
            echo "Available Xcode installations:"

            find /Applications \
              -maxdepth 1 \
              -type d \
              -name "Xcode*.app" \
              -print

            exit 1
          fi

          sudo xcode-select \
            --switch \
            "${xcode_path}/Contents/Developer"

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Display .NET environment
        shell: bash
        run: |
          set -e

          dotnet --info
          dotnet workload list

      - name: Install iOS workload
        shell: bash
        run: |
          set -e

          dotnet workload install ios

      - name: Clean previous outputs
        shell: bash
        run: |
          set -e

          rm -rf Seeker.iOS/bin
          rm -rf Seeker.iOS/obj
          rm -rf dist

          mkdir -p dist

      - name: Verify required project files
        shell: bash
        run: |
          set -e

          project_file="${GITHUB_WORKSPACE}/Seeker.iOS/Seeker.iOS.csproj"
          entitlements_file="${GITHUB_WORKSPACE}/Seeker.iOS/Entitlements.plist"
          info_plist="${GITHUB_WORKSPACE}/Seeker.iOS/Info.plist"

          if [[ ! -f "${project_file}" ]]; then
            echo "Missing project file: ${project_file}"
            exit 1
          fi

          if [[ ! -f "${entitlements_file}" ]]; then
            echo "Missing entitlements file: ${entitlements_file}"
            echo "Files present in Seeker.iOS:"
            find Seeker.iOS -maxdepth 1 -type f -print
            exit 1
          fi

          if [[ ! -f "${info_plist}" ]]; then
            echo "Missing Info.plist: ${info_plist}"
            exit 1
          fi

          echo "Project file:"
          ls -lh "${project_file}"

          echo "Entitlements file:"
          ls -lh "${entitlements_file}"

          echo "Info.plist:"
          ls -lh "${info_plist}"

          echo "Entitlements contents:"
          plutil -p "${entitlements_file}"

      - name: Restore iPhone runtime
        shell: bash
        run: |
          set -e

          dotnet restore \
            Seeker.iOS/Seeker.iOS.csproj \
            --runtime ios-arm64 \
            -p:SupportedOSPlatformVersion=15.0 \
            -p:TargetPlatformMinVersion=15.0

      - name: Build unsigned iOS 15 application
        shell: bash
        run: |
          set -o pipefail

          dotnet build \
            Seeker.iOS/Seeker.iOS.csproj \
            --configuration Release \
            --framework net10.0-ios \
            --runtime ios-arm64 \
            --no-restore \
            -p:SupportedOSPlatformVersion=15.0 \
            -p:TargetPlatformMinVersion=15.0 \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:UseInterpreter=false \
            -p:MtouchLink=Full \
            -p:TrimMode=full \
            -p:TrimmerSingleWarn=false \
            -p:ILLinkTreatWarningsAsErrors=true \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false \
            -p:CodesignEntitlements="${GITHUB_WORKSPACE}/Seeker.iOS/Entitlements.plist" \
            2>&1 | tee ios15-build.log

      - name: Locate application bundle
        shell: bash
        run: |
          set -e

          output_directory="Seeker.iOS/bin/Release/net10.0-ios/ios-arm64"

          echo "Produced application bundles:"

          find Seeker.iOS/bin/Release \
            -type d \
            -name "*.app" \
            -print

          app_bundle="$(
            find "${output_directory}" \
              -type d \
              -name "*.app" \
              -print \
              -quit
          )"

          if [[ -z "${app_bundle}" ]]; then
            echo "No iPhone .app bundle was generated."
            echo "Files generated under ${output_directory}:"

            find "${output_directory}" \
              -maxdepth 3 \
              -print

            exit 1
          fi

          echo "Application bundle: ${app_bundle}"
          echo "APP_BUNDLE=${app_bundle}" >> "${GITHUB_ENV}"

      - name: Verify application bundle
        shell: bash
        run: |
          set -e

          info_plist="${APP_BUNDLE}/Info.plist"

          if [[ ! -f "${info_plist}" ]]; then
            echo "Info.plist was not found in ${APP_BUNDLE}"
            exit 1
          fi

          echo "Application information:"

          bundle_identifier="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "${info_plist}"
          )"

          display_version="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "${info_plist}"
          )"

          build_version="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "${info_plist}"
          )"

          minimum_version="$(
            /usr/libexec/PlistBuddy \
              -c "Print :MinimumOSVersion" \
              "${info_plist}" \
              2>/dev/null \
              || true
          )"

          executable_name="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "${info_plist}"
          )"

          echo "CFBundleIdentifier=${bundle_identifier}"
          echo "CFBundleShortVersionString=${display_version}"
          echo "CFBundleVersion=${build_version}"
          echo "CFBundleExecutable=${executable_name}"
          echo "MinimumOSVersion=${minimum_version}"

          if [[ "${minimum_version}" != "15.0" ]]; then
            echo "Expected MinimumOSVersion 15.0."
            exit 1
          fi

          executable_path="${APP_BUNDLE}/${executable_name}"

          if [[ ! -f "${executable_path}" ]]; then
            echo "Application executable not found: ${executable_path}"
            exit 1
          fi

          echo "Application executable:"
          file "${executable_path}"

          echo "Application bundle size:"
          du -sh "${APP_BUNDLE}"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -e

          staging="${RUNNER_TEMP}/animaseek-ios15"
          ipa_path="${GITHUB_WORKSPACE}/dist/AnimaSeek-iOS15-unsigned.ipa"

          rm -rf "${staging}"
          mkdir -p "${staging}/Payload"
          mkdir -p "${GITHUB_WORKSPACE}/dist"

          cp -R \
            "${APP_BUNDLE}" \
            "${staging}/Payload/"

          (
            cd "${staging}"

            zip -qry \
              "${ipa_path}" \
              Payload
          )

          if [[ ! -f "${ipa_path}" ]]; then
            echo "The IPA was not generated."
            exit 1
          fi

          echo "Generated IPA:"
          ls -lh "${ipa_path}"

          echo "IPA contents:"
          unzip -l "${ipa_path}" | head -n 40

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: AnimaSeek-iOS15-unsigned
          path: dist/AnimaSeek-iOS15-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AnimaSeek-iOS15-build-log
          path: ios15-build.log
          retention-days: 30
          if-no-files-found: ignore
