name: Build AnimaSeek iOS 15 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ios15

concurrency:
  group: animaseek-ios15-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS 15 IPA
    runs-on: macos-26
    timeout-minutes: 60

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10.0.302
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -e

          xcode_path="/Applications/Xcode_26.6.app"

          if [[ ! -d "${xcode_path}" ]]; then
            echo "Xcode 26.6 was not found."
            echo "Available Xcode installations:"
            find /Applications \
              -maxdepth 1 \
              -type d \
              -name "Xcode*.app" \
              -print

            exit 1
          fi

          sudo xcode-select \
            --switch \
            "${xcode_path}/Contents/Developer"

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Display .NET environment
        shell: bash
        run: |
          dotnet --info
          dotnet workload list

      - name: Install iOS workload
        shell: bash
        run: |
          set -e
          dotnet workload install ios

      - name: Clean previous outputs
        shell: bash
        run: |
          rm -rf Seeker.iOS/bin
          rm -rf Seeker.iOS/obj
          rm -rf dist
          mkdir -p dist

      - name: Restore iPhone runtime
        shell: bash
        run: |
          set -e

          dotnet restore \
            Seeker.iOS/Seeker.iOS.csproj \
            --runtime ios-arm64 \
            -p:SupportedOSPlatformVersion=15.0 \
            -p:TargetPlatformMinVersion=15.0

      - name: Build unsigned iOS 15 application
        shell: bash
        run: |
          set -o pipefail

          dotnet build \
            Seeker.iOS/Seeker.iOS.csproj \
            --configuration Release \
            --framework net10.0-ios \
            --runtime ios-arm64 \
            --no-restore \
            -p:SupportedOSPlatformVersion=15.0 \
            -p:TargetPlatformMinVersion=15.0 \
            -p:UseInterpreter=false \
            -p:MtouchLink=Full \
            -p:TrimMode=full \
            -p:TrimmerSingleWarn=false \
            -p:ILLinkTreatWarningsAsErrors=true \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false \
            2>&1 | tee ios15-build.log

      - name: Locate application bundle
        shell: bash
        run: |
          set -e

          echo "Produced application bundles:"

          find Seeker.iOS/bin/Release \
            -type d \
            -name "*.app" \
            -print

          app_bundle="$(
            find Seeker.iOS/bin/Release/net10.0-ios/ios-arm64 \
              -type d \
              -name "*.app" \
              -print \
              -quit
          )"

          if [[ -z "${app_bundle}" ]]; then
            echo "No iPhone .app bundle was generated."
            exit 1
          fi

          echo "APP_BUNDLE=${app_bundle}" \
            >> "${GITHUB_ENV}"

      - name: Verify iOS deployment version
        shell: bash
        run: |
          set -e

          info_plist="${APP_BUNDLE}/Info.plist"

          if [[ ! -f "${info_plist}" ]]; then
            echo "Info.plist was not found in ${APP_BUNDLE}"
            exit 1
          fi

          echo "Application information:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "${info_plist}"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "${info_plist}"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "${info_plist}"

          minimum_version="$(
            /usr/libexec/PlistBuddy \
              -c "Print :MinimumOSVersion" \
              "${info_plist}" \
              2>/dev/null \
              || true
          )"

          echo "MinimumOSVersion=${minimum_version}"

          if [[ "${minimum_version}" != "15.0" ]]; then
            echo "Expected MinimumOSVersion 15.0."
            exit 1
          fi

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -e

          staging="${RUNNER_TEMP}/animaseek-ios15"
          rm -rf "${staging}"
          mkdir -p "${staging}/Payload"

          cp -R \
            "${APP_BUNDLE}" \
            "${staging}/Payload/"

          (
            cd "${staging}"

            zip -qry \
              "${GITHUB_WORKSPACE}/dist/AnimaSeek-iOS15-unsigned.ipa" \
              Payload
          )

          ls -lh \
            dist/AnimaSeek-iOS15-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: AnimaSeek-iOS15-unsigned
          path: dist/AnimaSeek-iOS15-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AnimaSeek-iOS15-build-log
          path: ios15-build.log
          retention-days: 30
          if-no-files-found: ignore
